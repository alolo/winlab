[package]
name = "cuelabs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["CueLabs Team"]
description = "Professional audio cue player for live performance"

[[bin]]
name = "cuelabs"
path = "src/main.rs"

[features]
default = ["asio"]
asio = ["cpal/asio"]

[dependencies]
# --- GUI ---
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["all_loaders"] }

# --- Audio ---
cpal = { version = "0.18.2" }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all", "crossbeam-channel"] }
symphonia = { version = "0.6.1", features = ["all"] }

# --- MIDI ---
midir = "0.11.1"
midly = "0.5"

# --- OSC ---
rosc = "0.11.4"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
rfd = "0.17.2"           # Native file dialogs
notify = "8.2.1"           # File system watcher
once_cell = "1"
parking_lot = "0.13"
crossbeam-channel = "0.5"
rustfft = "6"          # FFT для waveform анализа

[profile.dev]
opt-level = 1          # Небольшая оптимизация в дев режиме для аудио

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
