[package]
name = "cuelabs"
version = "0.1.0"
edition = "2021"
authors = ["CueLabs Team"]
description = "Professional audio cue player for live performance"

[[bin]]
name = "cuelabs"
path = "src/main.rs"

[dependencies]
# --- GUI ---
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }

# --- Audio ---
cpal = { version = "0.15", features = [] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }

# --- MIDI ---
midir = "0.10"
midly = "0.5"

# --- OSC ---
rosc = "0.10"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rfd = "0.15"           # Native file dialogs
notify = "7"           # File system watcher
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rustfft = "6"          # FFT для waveform анализа

[profile.dev]
opt-level = 1          # Небольшая оптимизация в дев режиме для аудио

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
